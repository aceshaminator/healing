<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/healing-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070D1F" />
        <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Healing by VisionAce</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070D1F;color:#e2e8f0;font-family:system-ui,sans-serif;padding:16px;text-align:center">
        <div style="max-width:420px">
          <p style="font-size:18px;font-weight:700;margin:0 0 8px">Healing is starting…</p>
          <p style="font-size:14px;line-height:1.5;margin:0 0 16px">
            If this screen stays, Healing could not start. Reload the page. If this is a medical emergency, do not wait: call <span class="boot-number">112</span>.
          </p>
          <p style="font-size:14px;line-height:1.5;margin:0 0 16px">
            Si cet écran reste affiché, Healing n’a pas pu démarrer. Rechargez la page. En cas d’urgence médicale, n’attendez pas : appelez le <span class="boot-number">112</span>.
          </p>
          <a id="boot-call" href="tel:112" style="display:block;background:#dc2626;color:#fff;padding:14px;border-radius:12px;font-weight:700;text-decoration:none;margin-bottom:12px">Call / Appeler 112</a>
          <button type="button" onclick="location.reload()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #64748b;background:transparent;color:#e2e8f0;font-size:14px;font-weight:600">Reload / Recharger</button>
        </div>
      </div>
      <script>
        try {
          var n = localStorage.getItem('healing_emergency_number') || '112';
          var spans = document.getElementsByClassName('boot-number');
          for (var i = 0; i < spans.length; i++) spans[i].textContent = n;
          var link = document.getElementById('boot-call');
          link.setAttribute('href', 'tel:' + n);
          link.textContent = 'Call / Appeler ' + n;
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
